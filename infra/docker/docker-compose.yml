name: hotelsaas

# Stage 2 - the database layer only. Services arrive from stage 3, and
# Kong / RabbitMQ / Redis at the stage that first needs them.

services:

  postgres:
    image: postgres:17
    # Not -alpine: the musl build has thinner locale/ICU support, and
    # collation decides ORDER BY and index behaviour. Not worth saving
    # 150MB on the one container that holds all the data.
    container_name: hs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/docker/.env}
      POSTGRES_DB: postgres
      # Read by the scripts in postgres/init.
      HS_SERVICE_PASSWORD: ${HS_SERVICE_PASSWORD:?set HS_SERVICE_PASSWORD in infra/docker/.env}
    command:
      - postgres
      # 13 services x Npgsql's default pool of 100 would ask for 1300
      # connections. The server default is 100, and the failure mode is
      # "too many clients already" with no obvious cause.
      - -c
      - max_connections=200
      # Turned on now because stage 10 is the concurrency stage and these
      # are exactly what we will want to read.
      - -c
      - log_min_duration_statement=200
      - -c
      - log_lock_waits=on
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything in here runs ONCE, on first start of an empty volume,
      # in filename order. Editing a script later does nothing until the
      # volume is wiped - use  ./infra/scripts/up.ps1 -Fresh
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [hotelsaas]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hs-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hotelsaas.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in infra/docker/.env}
      # Local only: skip pgAdmin's own login and master-password prompts.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hotelsaas]

volumes:
  pgdata:
    name: hotelsaas-pgdata
  pgadmin:
    name: hotelsaas-pgadmin

networks:
  hotelsaas:
    name: hotelsaas
